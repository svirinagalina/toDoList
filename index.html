<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Простой список задач">
  <title>Список задач</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" aria-labelledby="page-title">
    <header class="app__header">
      <p class="app__eyebrow">План на сегодня</p>
      <h1 id="page-title">Мои задачи</h1>
      <p class="app__summary" id="task-summary">0 задач</p>
    </header>

    <section class="task-panel" aria-labelledby="task-form-title">
      <h2 id="task-form-title">Добавить задачу</h2>
      <form class="task-form" id="task-form">
        <label class="visually-hidden" for="task-input">Название задачи</label>
        <input
          id="task-input"
          name="task"
          type="text"
          placeholder="Например, купить продукты"
          autocomplete="off"
          required
        >
        <button type="submit">Добавить</button>
      </form>
    </section>

    <section class="task-list-section" aria-labelledby="task-list-title">
      <div class="section-heading">
        <h2 id="task-list-title">Список задач</h2>
        <button class="button button--muted" id="clear-completed" type="button">
          Очистить выполненные
        </button>
      </div>

      <ul class="task-list" id="task-list" aria-live="polite"></ul>
      <p class="empty-state" id="empty-state">Здесь появятся ваши задачи.</p>
    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
